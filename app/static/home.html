<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhysHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        margin: 2rem auto;
        max-width: 36rem;
        padding: 0 1rem;
      }

      label {
        display: block;
        margin-top: 1rem;
      }

      input,
      button {
        box-sizing: border-box;
        font: inherit;
        padding: 0.5rem;
        width: 100%;
      }

      button {
        cursor: pointer;
        margin-top: 1rem;
      }

      pre {
        background: #f3f4f6;
        overflow-wrap: anywhere;
        padding: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Physics Hub</h1>
      <form id="login-form">
        <label for="username">Ім'я користувача</label>
        <input id="username" name="username" autocomplete="username" required value="guest">

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required value="guestguest">

        <button type="submit">Увійти</button>
      </form>
      <section aria-live="polite">
        <p id="login-status"></p>
        <ul>
          <li><a href="Maxwell/index.html">Maxwel</a></li>
          <li><a href="Carno2d/index.html">Carno2d</a></li>
          <li><a href="Gas2d/index.html">Gas2d</a></li>
          <li><a href="Waves1d/index.html">Waves1d</a></li>
          <li><a href="Waves2d/index.html">Waves2d</a></li>
          <li><a href="Mech2d/index.html">Mech2d</a></li>
        </ul>
      </section>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const loginStatus = document.querySelector("#login-status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const credentials = new URLSearchParams();
        credentials.set("username", formData.get("username"));
        credentials.set("password", formData.get("password"));

        try {
          const loginResponse = await fetch("/auth/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: credentials,
          });
          const loginData = await loginResponse.json();
          if (!loginResponse.ok) {
            throw new Error(loginData.detail || `Помилка входу (${loginResponse.status})`);
          }
          loginStatus.textContent = "Вхід виконано.";
        } catch (error) {
          alert(error.message);
        }
      });
    </script>
  </body>
</html>
